  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(".img-galeria").click(function (e) {
      var img = e.target.src;
      var modelo = '<div class="modelo" id="modelo"><img src="' + img + '" class="img-modelo"><div class="cerrar">X</div></div>';
      $("body").append(modelo);

      $(".cerrar").click(function () {
        $(".modelo").remove();
      });
    });

    $(window).keyup(function (e) {
      if (e.which == 27) {
        $(".modelo").remove();
      }
    });
  </script>
